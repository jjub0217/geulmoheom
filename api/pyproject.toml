[project]
name = "geulmoheom-api"
version = "0.1.0"
description = "글모험 백엔드 (FastAPI + LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "google-genai>=1.0",
    # 인증 토큰. 직접 HMAC 을 짜지 않는다 — alg 혼동(`alg: none`·HS/RS 바꿔치기)과
    # 상수시간 비교는 손으로 짜면 조용히 틀리는 자리다. 여기서 틀리면 아이 계정이 뚫린다.
    "pyjwt>=2.10",
    # 학부모 비밀번호 해시. bcrypt 의 72바이트 조용한 잘림이 없다.
    "argon2-cffi>=23.1",
    # 삽화 저장 (Cloudflare R2, S3 호환). **SigV4 를 손으로 짜지 않는다** —
    # `pyjwt` 를 넣은 것과 같은 이유로, 조용히 틀리는 자리다.
    "boto3>=1.43.89",
    # 가이드 레퍼런스에서 **정면 1면만 잘라 쓴다** (`app/artwork.py` `_정면`).
    # 2026-09-08 에 런타임 의존성이 됐다 — 시트를 통째로 넣으면 스와치 라벨 글자와
    # 턴어라운드 구도가 그림에 박히고, **그 실패는 폴백이 못 막는다.**
    # 잘린 사본을 저장소에 두는 대신 정본을 런타임에 자르는 이유는 같은 파일에 있다.
    "pillow>=11.0",
]

# LLM 프로바이더는 Google Gemini (docs/adr/0005). 모델명은 미정이라 코드에 기본값을
# 두지 않는다 — W1 스모크로 후보 압축, W2 벤치로 확정.
# LangGraph 는 Stage 1(GM 서사·상태 그래프)에서 들어온다. Stage 0 에는 쓰이지 않아
# 지금 넣지 않는다 — 안 쓰는 무거운 의존성이 uv sync 를 느리게 한다.

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # starlette TestClient 가 httpx2 를 쓴다. 없으면 deprecation 경고가 뜬다
    # (anthropic 이 끌고 오던 것이 google-genai 로 바뀌며 빠졌다).
    "httpx2>=0.28",
]

[tool.uv]
package = false

# ── ruff ────────────────────────────────────────────────
# Makefile lint 는 `ruff check .` 와 `ruff format --check .` 를 함께 돌린다.
[tool.ruff]
line-length = 100
target-version = "py312"
# alembic 이 만든 마이그레이션은 생성물이다. 손으로 포맷을 맞추면 다음 autogenerate 에서
# 다시 어긋난다. 손으로 쓰는 migrations/env.py 는 계속 검사한다.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "ASYNC",     # 비동기 함수 안의 블로킹 호출
    "G",         # flake8-logging-format
    "LOG",       # 로깅 오용
    "RUF",
]
# G004(로깅에 f-string) 는 끄지 않는다. `logger.info(f"...{text}")` 로 아이 원문이
# 로그에 새는 것을 기계적으로 막는 유일한 장치다 (api/CLAUDE.md 「절대 하지 않는 것」).

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ── pytest ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# app 을 tests 에서 import 하려면 필요하다 ([tool.uv] package = false 라 설치되지 않는다)
pythonpath = ["."]
asyncio_mode = "auto"
# **루프를 세션 하나로 고정한다.** 기본값(테스트마다 새 루프)이면 `app/db.py` 의
# 모듈 전역 엔진이 첫 루프의 커넥션을 풀에 물고 있다가 다음 테스트에서
# "attached to a different loop" 로 죽는다. 엔진을 테스트용으로 갈아끼우는 길도
# 있지만, 그러면 `app/api/system.py` 처럼 이름으로 import 한 쪽이 옛 엔진을 계속 쓴다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# **`실물` 은 기본 실행에서 뺀다.** 진짜 Google 로 나가는 검사라, 넣으면 이 잡이
# 남의 가용성에 묶이고 **네트워크가 흔들린 것과 코드가 깨진 것이 같은 빨간불**이 된다.
# 도는 자리는 **느린 잡**이다 — `uv run pytest -m 실물` (`주차계획/W5.md` 백엔드 1번).
# 명령줄에서 준 `-m` 이 여기 값을 덮는다.
addopts = "-q -m 'not 실물 and not 느린'"
markers = [
    "실물: 진짜 Gemini 로 나간다. 뒤집기 전용이고 기본 실행에서 빠진다",
    # **빠른 잡과 섞지 않는다.** 서버를 띄우고 기다리는 값이 있어 매 저장마다 돌 것이
    # 아니고, 섞으면 그 느림이 **다음에 또 미루는 이유**가 된다 (`주차계획/W5.md` 1번).
    # 도는 자리: `uv run pytest -m 느린` · CI 의 느린 잡.
    "느린: uvicorn 을 진짜로 띄운다. Postgres·Redis 가 필요하고 기본 실행에서 빠진다",
]

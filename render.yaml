# 배포 청사진 — **api 만 여기 있다** (`docs/adr/0012`).
# web 은 Vercel 이고 그쪽 설정은 `web/vercel.json` 이다. 브라우저에게는 Vercel 호스트
# 하나만 보이고, `/api/*` 를 Vercel 이 여기로 넘긴다. **이 주소는 노출되지 않는다.**
#
# **⚠ 무료 플랜이라 치르는 값 셋은 `adr/0012` 「감수하는 것」에 적혀 있다** —
# ① Cold Start 30~50초(아이가 맞는다) ② 무료 Postgres 는 90일 뒤 삭제 ③ Redis 무영속.

services:
  - type: web
    name: geulmoheom-api
    runtime: docker
    plan: free
    # 한국에서 가장 가까운 무료 리전. 바꾸면 DB·Key Value 도 같이 옮겨야 한다.
    region: singapore
    dockerfilePath: ./api/Dockerfile
    # **저장소 루트다.** 런타임이 `docs/` 를 읽는다 — 이유는 Dockerfile 머리말에 있다.
    dockerContext: .
    # `/healthz` 는 인증도 DB 도 안 본다 (`app/api/system.py`). 의존성을 보는 것은
    # `/readyz` 인데, 그걸 헬스체크로 걸면 **DB 가 잠깐 흔들릴 때 인스턴스가 죽는다.**
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: pilot

      # ⛔ **`fromDatabase` 를 쓰지 않는다.** Render 가 주는 문자열은
      # `postgresql://…` 인데 우리는 **asyncpg 드라이버**라 `postgresql+asyncpg://…`
      # 여야 한다 (`app/db.py` `엔진만들기`). 스킴이 틀리면 **기동에서 바로 죽는다** —
      # 조용하지 않아서 다행이지만, 배포 당일에 시간을 먹는 자리다.
      # → 대시보드에서 **Internal Database URL 을 붙여 넣되 `postgresql+asyncpg://` 로
      #   앞을 갈아 넣는다.**
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: geulmoheom-cache
          type: keyvalue
          property: connectionString

      # ── 아래는 비어 있으면 **뜨지 않는다** (`app/config.py` PILOT_REQUIRED) ──
      # 조용히 떠서 아이 문장을 받아 놓고 첫 호출에서 터지는 것보다 낫다.
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        # ⚠ **삽화 저장 키가 이 값에서 유도된다** (`app/storage.py` `_조각`).
        # 갈면 넣어 둔 `legendary` 18장을 **전부 다시 넣어야 한다** —
        # 안 하면 60조합이 통째로 기본 에셋이 되고 **아무 데도 빨간불이 안 뜬다**.
        sync: false
      - key: EVALUATOR_MODEL
        # W2 벤치로 확정 (`api/benchmarks/W2-evaluator-bench.md`).
        value: gemini-3.1-flash-lite
      - key: IMAGE_MODEL
        # W1 벤치로 확정 (`docs/adr/0006`). **이번 파일럿에는 호출이 안 나간다** —
        # 굽는 자리를 막아 뒀다 (W5 백엔드 7번). 그래도 비면 기동을 막는 값이다.
        value: gemini-3.1-flash-lite-image
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLIENT_IP_HEADER
        # 앞단이 **덮어쓰는** 헤더 이름이어야 한다. **`X-Forwarded-For` 를 적지 않는다** —
        # 클라이언트가 채워 보낼 수 있어 접속 코드 속도 제한을 요청마다 비껴간다
        # (`app/child_auth_limit.py`). 우리 앞단은 Vercel 이므로 후보는
        # `X-Vercel-Forwarded-For` 다 — **올린 뒤 실제 헤더를 보고 채운다.**
        # 비면 기동이 막히므로 「모르는 채로 지나가는」 경우는 없다.
        sync: false

  - type: keyvalue
    name: geulmoheom-cache
    plan: free
    region: singapore
    # 비공개 네트워크에서만 붙는다. 공개 IP 를 열지 않는다.
    ipAllowList: []

databases:
  - name: geulmoheom-db
    plan: free
    region: singapore
    databaseName: geulmoheom
    user: geulmoheom

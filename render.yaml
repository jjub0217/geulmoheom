# 배포 청사진 — **api 만 여기 있다** (`docs/adr/0012`).
# web 은 Vercel 이고 그쪽 설정은 `web/vercel.json` 이다. 브라우저에게는 Vercel 호스트
# 하나만 보이고, `/api/*` 를 Vercel 이 여기로 넘긴다. **이 주소는 노출되지 않는다.**
#
# **⚠ 이미 대시보드에서 Postgres·Key Value 를 만들었다면 이 파일을 그대로 적용하지 않는다** —
# 청사진은 기존 것을 **가져오지 않고 새로 만든다.** 그때는 **Web Service 만 손으로 만들고**
# 이 파일은 **값의 출처로만** 읽는다 (`api/README.md` 8-1).
#
# **⚠ 무료 플랜이라 치르는 값 셋은 `adr/0012` 「감수하는 것」에 적혀 있다** —
# ① Cold Start 30~50초(아이가 맞는다) ② 무료 Postgres 는 90일 뒤 삭제 ③ Redis 무영속.

services:
  - type: web
    name: geulmoheom-api
    runtime: docker
    plan: free
    # 한국에서 가장 가까운 무료 리전. 바꾸면 DB·Key Value 도 같이 옮겨야 한다.
    region: singapore
    dockerfilePath: ./api/Dockerfile
    # **저장소 루트다.** 런타임이 `docs/` 를 읽는다 — 이유는 Dockerfile 머리말에 있다.
    dockerContext: .
    # `/healthz` 는 인증도 DB 도 안 본다 (`app/api/system.py`). 의존성을 보는 것은
    # `/readyz` 인데, 그걸 헬스체크로 걸면 **DB 가 잠깐 흔들릴 때 인스턴스가 죽는다.**
    #
    # **✅ 2026-09-17 — 사용자가 대시보드에 `/healthz` 를 넣었다. 이제 걸려 있다.**
    # (화면으로 확인 · Health Check Path = `/healthz`). **아래는 그 전의 기록이고
    # 지우지 않는다** — **왜 이 줄이 파일에 있는데도 안 돌았는지**가 근거다.
    # **⚠ 다음 배포부터 먹는다.** 이미 돈 배포의 18분은 그대로다.
    #
    # ~~**⛔ 이 줄은 첫 커밋(`37773d6`)부터 여기 있었는데 운영에는 안 걸려 있다.**~~
    # 2026-09-17 배포 로그가 **`HEAD / → 404` 뒤 18분 만에 `==> Timed Out`** 이었다 —
    # Render 가 **`/` 를 두드렸다**는 뜻이고, 그건 **헬스체크 경로가 서비스에 없을 때의
    # 기본 동작**이다. 바로 다음 줄이 「Detected service running on port 10000」이라
    # **앱은 멀쩡했다.**
    #
    # **⭐ 원인은 이 파일이 적용되지 않는다는 것이다** — 위 머리말대로 **Web Service 를
    # 손으로 만들었고, 이 파일은 「값의 출처」로만 읽힌다.** 그래서 **여기 적는 것으로는
    # 안 고쳐졌다. 대시보드의 Health Check Path 를 사람이 넣어야 했다.**
    #
    # **⛔ 그 성질은 안 바뀌었다 — 이 파일은 여전히 적용되지 않는다.** `TUTORIAL_ENABLED`
    # 도 같은 자리다. **여기 값을 적는 것은 「기록」이지 「설정」이 아니다.**
    #
    # **⚠ 지금 아픈 게 아니라 다음이 아프다** — **매 배포가 18분씩 늦고**, 더 나쁜 것은
    # **「진짜 실패」와 로그 모양이 같아지는 것**이다. 2026-09-17 에 실제로 한 세션이
    # **로그만 보고 「이 배포는 실패했다」로 읽었고 그게 틀렸다.**
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: pilot

      # ⛔ **`fromDatabase` 를 쓰지 않는다.** Render 가 주는 문자열은
      # `postgresql://…` 인데 우리는 **asyncpg 드라이버**라 `postgresql+asyncpg://…`
      # 여야 한다 (`app/db.py` `엔진만들기`). 스킴이 틀리면 **기동에서 바로 죽는다** —
      # 조용하지 않아서 다행이지만, 배포 당일에 시간을 먹는 자리다.
      # → 대시보드에서 **Internal Database URL 을 붙여 넣되 `postgresql+asyncpg://` 로
      #   앞을 갈아 넣는다.**
      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          name: geulmoheom-cache
          type: keyvalue
          property: connectionString

      # ── 아래는 비어 있으면 **뜨지 않는다** (`app/config.py` PILOT_REQUIRED) ──
      # 조용히 떠서 아이 문장을 받아 놓고 첫 호출에서 터지는 것보다 낫다.
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        # ⚠ **삽화 저장 키가 이 값에서 유도된다** (`app/storage.py` `_조각`).
        # 갈면 넣어 둔 `legendary` 18장을 **전부 다시 넣어야 한다** —
        # 안 하면 60조합이 통째로 기본 에셋이 되고 **아무 데도 빨간불이 안 뜬다**.
        sync: false
      - key: EVALUATOR_MODEL
        # W2 벤치로 확정 (`api/benchmarks/W2-evaluator-bench.md`).
        value: gemini-3.1-flash-lite
      - key: IMAGE_MODEL
        # W1 벤치로 확정 (`docs/adr/0006`). **이번 파일럿에는 호출이 안 나간다** —
        # 굽는 자리를 막아 뒀다 (W5 백엔드 7번). 그래도 비면 기동을 막는 값이다.
        value: gemini-3.1-flash-lite-image
      # 삽화 저장소. **2026-09-12 에 Cloudflare R2 → AWS S3** (ADR 은 PM 몫).
      # 버킷은 퍼블릭 차단 그대로다 — api 가 프록시한다 (미결 11-7).
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        # **비면 기동이 막힌다.** 안 막으면 botocore 가 환경을 뒤지다
        # **업로드 시점에** 실패한다 — 아이가 기다린 뒤에 드러나는 자리다.
        value: ap-northeast-2
      - key: CLIENT_IP_HEADER
        # 앞단이 **덮어쓰는** 헤더 이름이어야 한다. **`X-Forwarded-For` 를 적지 않는다** —
        # 클라이언트가 채워 보낼 수 있어 접속 코드 속도 제한을 요청마다 비껴간다
        # (`app/child_auth_limit.py`). 우리 앞단은 Vercel 이므로 후보는
        # `X-Vercel-Forwarded-For` 다 — **올린 뒤 실제 헤더를 보고 채운다.**
        # 비면 기동이 막히므로 「모르는 채로 지나가는」 경우는 없다.
        sync: false

      # ⛔ **기능 스위치다. 비밀이 아니라서 `sync: false` 가 아니라 값을 적는다.**
      # 튜토리얼 「나침반 깨우기」(A-6). **2026-09-16 대표 검수 통과 뒤 켰다.**
      #
      # **⚠ 2026-09-17 까지 이 키가 여기 없었다** — 값이 대시보드에만 살았다.
      # 무서운 것은 꺼지는 게 아니라 **꺼진 것이 화면으로 안 보이는 것**이다:
      # **튜토리얼이 없는 것과 「신규 사용자가 아닌 것」이 똑같이 생겼다.**
      # 아이는 평범한 카드 화면을 보고 아무도 이상하다고 안 한다.
      #
      # **켜졌는지는 주석이 아니라 이걸로 본다** (`app/tutorial.py` 와 같은 문장):
      #   새 계정으로 `GET /cards/next` → `card_id` 가 `t1` 이면 켜진 것,
      #   카드 번호(`c15` 등)면 꺼진 것.
      - key: TUTORIAL_ENABLED
        value: "true"

  - type: keyvalue
    name: geulmoheom-cache
    plan: free
    region: singapore
    # 비공개 네트워크에서만 붙는다. 공개 IP 를 열지 않는다.
    ipAllowList: []

databases:
  - name: geulmoheom-db
    plan: free
    region: singapore
    databaseName: geulmoheom
    user: geulmoheom

name: ci

on:
  pull_request:
  push:
    branches: [main]

# paths-filter 는 pull_request 에서 PR 변경 파일 목록을 GitHub API 로 읽는다.
# 저장소 기본 토큰 권한(contents 만)으로는 403 이 나 changes 잡이 통째로 실패하고,
# api·web 이 skip 되면서 all-green 까지 빨개진다. push 이벤트에서는 커밋 diff 라 안 드러난다.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      web: ${{ steps.f.outputs.web }}
      contracts: ${{ steps.f.outputs.contracts }}
      copy: ${{ steps.f.outputs.copy }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            # `docs/**` 를 통째로 넣는다. **api 코드가 PM 문서를 런타임에 읽기 때문이다** —
            # 안전_어휘_기준(moderation) · 장면카드_초안(scene_cards) · 루브릭_예시셋(rubric) ·
            # MVP_PRD(rubric·scaffold). 즉 **문서만 바꾼 커밋이 서버를 깨뜨릴 수 있다.**
            #
            # **읽는 문서를 나열하지 않는다.** 코드가 다음 문서를 읽기 시작하는 날 목록이
            # 조용히 낡고, 그때 깨진 것을 잡을 장치가 다시 없어진다. 실제로 2026-09-07 에
            # 목록을 세어 보니 셋인 줄 알았던 것이 다섯이었고 `MVP_PRD.md` 는 두 모듈이
            # 읽고 있었다. 문서 커밋마다 api 테스트가 도는 값이 그 위험보다 싸다.
            api: ['api/**', 'infra/**', 'docs/**']
            web: ['web/**']
            contracts: ['api/**', 'web/**', 'Makefile', '.github/workflows/ci.yml']
            # **`docs/문구.md` 를 넣는다.** 문서가 먼저 바뀌는 것이 정상 순서이고,
            # **그 순간부터 화면은 옛말을 한다** — 넷 다 그 상태로 며칠에서 일주일 갔다.
            # 여기서 빼면 **문서만 고친 커밋은 조용히 지나가고**, 다음에 누가 문구 파일을
            # 건드릴 때까지 아무도 모른다. **그게 우리가 고치려는 실패 그 자체다.**
            # **⚠ 대신 검사는 절대 「문서를 고쳐라」라고 말하지 않는다** — 빨간불의 뜻은
            # 언제나 「코드가 아직 안 따라왔다」다 (infra/check-copy.mjs 머리말).
            copy: ['web/src/**', 'api/app/errors.py', 'docs/문구.md', 'infra/check-copy.mjs']

  # api 테스트는 **진짜 Postgres 를 쓴다** (2026-09-07, E-3). 계정·접속 코드·폐기가
  # DB 위에 서 있어, DB 없이 도는 테스트만 남기면 그 셋이 CI 에서 안 돈다.
  # SQLite 로 갈아끼울 수 없다 — 모델이 JSONB·ARRAY 를 쓰고, 무엇보다 여기서 보려는 것이
  # "마이그레이션대로 만든 스키마 위에서 도는가" 다 (tests/conftest.py 가 alembic 을 돌린다).
  #
  # Redis 는 넣지 않는다. 되묻기 카운터는 죽어도 아이가 계속 쓸 수 있게 만들어져 있고
  # (app/scaffold.py), 그 경로를 테스트가 직접 갈아끼운다.
  #
  # **`alembic check` 은 이 잡의 `pytest` 안에서 돈다** (api/tests/test_migrations.py) —
  # 별도 단계로 두지 않았다. 그 검사는 **마이그레이션이 돌아간 DB** 위에서만 뜻이 있고,
  # 그것을 세우는 곳이 `tests/conftest.py` 하나다. 단계로 빼면 여기서 DB 이름과
  # `alembic upgrade head` 를 **두 번째로** 적게 되고, 둘이 갈리는 날 조용히 어긋난다.
  # **찾는 사람을 위해 — `grep alembic ci.yml` 은 이 주석만 물린다.**
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geulmoheom
          POSTGRES_USER: geulmoheom
          POSTGRES_PASSWORD: geulmoheom
        # 포트를 5433 으로 맞춘다 — 로컬 compose 와 같은 값이라 conftest 기본값이 그대로 돈다.
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U geulmoheom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest 가 여기에 `_test` 를 붙여 테스트 DB 를 따로 만든다.
      DATABASE_URL: postgresql+asyncpg://geulmoheom:geulmoheom@localhost:5433/geulmoheom
      # 서명 없이는 토큰을 못 만든다 (app/tokens.py). **CI 전용 값이다.**
      JWT_SECRET: ci-secret-not-used-outside-github-actions
    steps:
      - uses: actions/checkout@v4
      # 패키지 초기화 전에는 검사를 건너뛴다. pyproject.toml 이 생기는 순간 자동으로 켜진다.
      - id: init
        run: |
          if [ -f api/pyproject.toml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=api 미초기화::api/pyproject.toml 이 없어 lint·test를 건너뜁니다"
          fi
      - uses: astral-sh/setup-uv@v3
        if: steps.init.outputs.ready == 'true'
      # **`ruff check` 과 `ruff format --check` 은 다른 것을 본다.** 앞은 규칙 위반,
      # 뒤는 줄을 어떻게 감았는가다. 여기에 앞만 있던 동안 **드리프트가 조용히 쌓였다** —
      # 2026-09-14 에 세 파일이 걸려 있었고 세 커밋이 전부 초록으로 지나갔다
      # (`24c819f` · `4becf54` · `1160ec5`). 그것을 보는 곳은 `make lint` 하나였는데
      # **그걸 도는 자리가 없었다.**
      #
      # **순서는 `make lint` 와 같다** — 그 타깃과 이 줄이 갈리면 「로컬에서 초록인데
      # CI 가 빨갛다」가 난다.
      #
      # **⚠ 이 줄은 push 뒤에야 막는다.** 2026-09-14 오후에 CI 가 살아나 실제로 돈다
      # (그 전 반나절은 결제로 멈춰 있어 「아무것도 안 막는다」고 적혀 있던 자리다).
      # **갈라진 것이 `main` 에 들어가는 것 자체를 막는 자리는 커밋 전에 사람이 돌리는
      # 줄**(`api/CLAUDE.md`)이고, 그건 이 파일이 아니라 거기서 고쳐야 한다 —
      # 2026-09-14 에 사용자에게 올라갔다.
      # **검사 명령을 여기 적지 않는다 — `Makefile` 이 정의한다.** 같은 명령이
      # Makefile·이 파일·`api/CLAUDE.md` 셋에 흩어져 있어 **한 곳에서 포맷 검사가 빠졌고**,
      # 그 구멍으로 2026-09-14 에 포맷만 틀린 커밋 둘이 들어왔다. **검사가 늘 때 고칠
      # 자리가 하나여야 CI 와 로컬이 같은 것을 잰다.**
      #
      # **`lint` 가 아니라 `lint-api` 다** — 이 잡에는 node·pnpm 이 없다. `lint` 는
      # `lint-web` 까지 부르고, 그쪽은 `web` 잡 몫이다.
      - if: steps.init.outputs.ready == 'true'
        run: make lint-api test-api

  # **느린 갈래다 — 여기서만 `uvicorn` 이 진짜로 뜬다** (api/tests/test_e2e_server.py).
  # 위 `api` 잡은 `TestClient` 로 앱 객체를 직접 부르고, `web` 잡은 브라우저에서 응답을
  # 가로챈다 — **둘 다 프로세스 경계를 안 지난다.** 기동 순서 · 설정 읽기 ·
  # 쿠키가 실제 응답 헤더로 나가는 것 · 라우팅 접두사가 여기서만 잡힌다.
  #
  # **빠른 잡과 섞지 않는다.** 섞으면 매 push 가 느려지고, **느려지면 다음에 또 미루는
  # 이유가 된다** — W3·W4 에서 두 번 미룬 방식이 정확히 그것이었다 (`주차계획/W5.md` 1번).
  #
  # **`실물` 을 같이 돈다** (`-m '느린 or 실물'`). 그 표시가 붙은 검사는 **진짜 Google 로
  # 나가지만 못 쓰는 키로 나간다** — 돈이 아니라 거절을 받는 것을 재는 뒤집기라
  # (api/tests/test_llm.py) **비용이 없고, 문서가 적어 둔 집이 이 잡이다**
  # (`api/pyproject.toml` `markers`). 빠른 잡에 두면 **남의 가용성이 매 push 를 물든다.**
  #
  # **LLM 호출은 태우지 않는다** — 유료고 결과가 흔들린다. 서버 안에서 가짜 앞단으로
  # **주소를 돌리고**(`GEMINI_BASE_URL`), `GEMINI_API_KEY` 에 **못 쓰는 값**을 넣어
  # 가짜를 안 지난 호출이 **과금이 아니라 거절로 죽게** 한다. 그 둘은 테스트가 직접
  # 세우므로 **여기에 키를 넣지 않는다 — 넣으면 그 뒤집기가 무의미해진다.**
  #
  # **✅ 2026-09-14 오후에 처음 실제로 돌았다 — `2 passed, 559 deselected in 4.56s`.**
  # **잡 색이 아니라 로그에서 테스트 수를 세어** 확인한 값이다(38초). 그 둘은 서버를
  # 태우는 갈래와 `실물` 뒤집기이고, **`실물` 이 통과했다는 것은 러너에서 진짜 Google
  # 까지 나가 `API_KEY_INVALID` 로 거절당했다는 뜻**이다 — 돈 막는 자리가 실측됐다.
  api-slow:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      # 포트를 로컬 compose 와 같은 값으로 맞춘다 — `api` 잡과 같은 이유로,
      # conftest 기본값이 그대로 돈다 (infra/docker-compose.yml).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geulmoheom
          POSTGRES_USER: geulmoheom
          POSTGRES_PASSWORD: geulmoheom
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U geulmoheom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # **Redis 는 여기 있어야 한다.** `api` 잡과 갈리는 자리다 — 거기서는 테스트가
      # Redis 경로를 직접 갈아끼우지만, **여기서는 진짜 서버가 뜨므로 아무것도 안 갈린다.**
      # 없어도 초록이 뜬다(속도 제한·비용 기록이 전부 열어 주는 쪽으로 실패한다,
      # app/child_auth_limit.py) — **그래서 더 필요하다. 없으면 이 잡이 재는 것이
      # 제품이 아니라 「Redis 가 죽은 제품」이 된다.**
      redis:
        image: redis:7-alpine
        ports: ["6381:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # conftest 가 여기에 `_test` 를 붙이고, **태운 서버에 그 주소를 그대로 넘긴다**
      # (api/tests/test_e2e_server.py 86행). 개발 DB 이름을 쓰면 서버와 테스트가
      # 다른 DB 를 문다.
      DATABASE_URL: postgresql+asyncpg://geulmoheom:geulmoheom@localhost:5433/geulmoheom
      JWT_SECRET: ci-secret-not-used-outside-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # 로컬에서 돌리는 것과 **같은 명령**이다 — 표시 조합(`-m '느린 or 실물'`)을
      # 여기 적지 않고 `Makefile` 의 `test-api-slow` 를 부른다. 위 `api` 잡과 같은 이유다.
      - run: make test-api-slow

  # web 의 **빠른 갈래**다 — lint · 단위 · **목을 태우는 E2E**. 셋 다 서버가 필요 없다.
  #
  # **서버까지 붙는 갈래는 여기 넣지 않는다** (`주차계획/W5.md` 1번). 그쪽은 Postgres·Redis 와
  # 진짜 api 가 필요해서 느리고, **섞으면 매 push 가 느려진다. 느려지면 다음에 또 미루는 이유가 된다** —
  # W3·W4 에서 두 번 미룬 방식이 정확히 그것이었다. **잡을 갈라 두면 느린 쪽이 빠른 쪽을 안 끈다.**
  #
  # **E2E 142개는 브라우저에서 응답을 가로채므로 api 가 죽어 있어도 돈다** (`playwright.config.ts` 머리말).
  # 그게 약점이자 여기 들어올 수 있는 이유다 — **이 잡이 재는 것은 화면이지 서버가 아니다.**
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: init
        run: |
          if [ -f web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=web 미초기화::web/package.json 이 없어 lint·test를 건너뜁니다"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.init.outputs.ready == 'true'
        with: { version: 11 }
      - uses: actions/setup-node@v4
        if: steps.init.outputs.ready == 'true'
        with: { node-version-file: web/.nvmrc, cache: pnpm }
      # **`pnpm typecheck` 은 `next typegen` 을 먼저 돌린다.** `layout.tsx` 가 쓰는 `LayoutProps` 는
      # **Next 가 만들어 주는 전역 타입**이라 `.next/` 가 없으면 없다 — 로컬은 dev 를 띄운 적이 있어
      # 통과하고 **CI 는 죽는다.** 2026-09-09 에 이 단계를 붙이자마자 그게 나왔다.
      # **로컬과 CI 가 갈리는 자리를 이 검사가 첫 커밋에서 잡은 셈**이다.
      #
      # **타입 검사가 먼저다.** `eslint` 는 **깨진 import 를 못 잡는다** — 2026-09-09 에
      # 헬퍼 파일 이름을 바꾸고 한 곳이 옛 이름을 가리키는 채로 **lint 가 초록이었다.**
      # e2e 가 결국 잡았지만 **원인에서 먼 자리에서** 잡았고, **파일럿 9일은 매일 핫픽스를 치는
      # 기간**이라 그때 타입 검사가 없는 것이 제일 위험하다 (2026-09-09 PM 판정).
      - if: steps.init.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile && cd web && pnpm typecheck && pnpm lint && pnpm test
      # 브라우저는 러너에 없다. **버전을 여기 적지 않는다** — 설치되는 것은
      # `@playwright/test` 가 정하는 짝이라, 여기 숫자를 박으면 **둘이 갈리는 날 조용히 어긋난다.**
      - if: steps.init.outputs.ready == 'true'
        run: cd web && pnpm exec playwright install --with-deps chromium
      # 로컬에서 돌리는 것과 **같은 명령**이다. CI 에서만 다르게 돌리면
      # **CI 가 재는 것이 개발자가 보는 것과 달라진다.**
      - if: steps.init.outputs.ready == 'true'
        run: cd web && pnpm e2e

  # web 의 **느린 갈래** — **브라우저가 진짜 api 를 문다** (`주차계획/W6.md` 프론트 6번).
  #
  # **위 `web` 잡과 갈라 둔다.** 거기 e2e 200개는 **브라우저에서 응답을 가로채므로 api 가
  # 죽어 있어도 초록**이고, 그래서 빠르다. **여기는 Postgres·Redis 와 진짜 uvicorn 이 필요해
  # 느리다** — 섞으면 매 push 가 느려지고, **느려지면 다음에 또 미루는 이유**가 된다.
  # `api-slow` 가 같은 판단으로 갈라져 있다.
  #
  # **⛔ 돈이 걸린 자리다.** api 를 진짜로 태우면 묘사 평가·그림이 **유료 호출**이 될 수 있고
  # **그건 초록으로 지나간다**(응답이 오니까). 하네스가 **가짜 앞단으로 주소를 돌리고**
  # **못 쓰는 키**를 넣는다 (`web/e2e/_서버하네스.mjs`) — 백엔드가 세운 둘을 그대로 쓴다.
  web-slow:
    needs: changes
    # **api 가 바뀌어도 돈다.** 이 갈래가 잡는 것은 **둘 사이**라, 한쪽만 보면
    # **서버가 바뀌어 화면이 깨진 날**을 놓친다.
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geulmoheom
          POSTGRES_USER: geulmoheom
          POSTGRES_PASSWORD: geulmoheom
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U geulmoheom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # **Redis 가 없어도 초록이 뜬다** — 속도 제한·비용 기록이 전부 **열어 주는 쪽으로**
      # 실패한다. **그래서 더 필요하다**: 없으면 이 잡이 재는 것이 제품이 아니라
      # 「Redis 가 죽은 제품」이 된다 (`api-slow` 와 같은 이유).
      redis:
        image: redis:7-alpine
        ports: ["6381:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://geulmoheom:geulmoheom@localhost:5433/geulmoheom
      JWT_SECRET: ci-secret-not-used-outside-github-actions
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc, cache: pnpm }
      # **빈 DB 다.** 로컬은 백엔드 conftest 가 만들어 둔 DB 를 쓰지만 여기는 아무것도 없다 —
      # **마이그레이션과 카드 시드를 안 하면 `/cards/next` 가 카드를 못 준다.**
      - run: cd api && uv sync && uv run alembic upgrade head
      # **정본은 `docs/장면카드_초안.md` 이고 DB 는 사본이다.** 안 뿌리면 `/readyz` 가 degraded 다.
      - run: cd api && PYTHONPATH=. uv run python scripts/seed_cards.py
      - run: pnpm install --frozen-lockfile
      - run: cd web && pnpm exec playwright install --with-deps chromium
      # 로컬에서 돌리는 것과 **같은 명령**이다.
      - run: cd web && pnpm e2e:server

  # 계약 드리프트: api 의 OpenAPI 와 커밋된 web/src/api/types.gen.ts 가 갈라지면 빨개진다.
  # 완료 조건은 "명세를 바꾸고 make contracts 를 안 돌리면 CI 가 빨개진다" 하나다.
  #
  # api·web 어느 쪽이 바뀌어도 돈다. 드리프트는 양방향이다 —
  # 스펙을 고치고 재생성을 안 한 경우와, types.gen.ts 를 손으로 고친 경우.
  # 검사 자체를 담은 Makefile·이 워크플로도 경로에 넣는다 — 검사를 고쳐 놓고
  # 그 커밋에서 안 돌면 깨진 검사가 그대로 들어온다.
  #
  # **서버를 띄우지 않는다.** app.openapi() 를 직접 뽑는다 (api/scripts/dump_openapi.py).
  # postgres·redis·인증서를 세우면 계약 검사가 인프라 상태를 따라 빨개진다.
  # 서버까지 붙는 E2E 는 **W5** 몫이다 — W3·W4 에서 두 번 미뤄졌다.
  #
  # 다른 잡과 달리 "패키지 미초기화면 건너뛴다" 가드를 두지 않는다.
  # 못 돌 때 조용히 통과하는 드리프트 검사는 없느니만 못하다 — 없으면 그냥 죽어야 한다.
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc, cache: pnpm }
      # openapi-typescript 는 web 의 devDependency 다. 설치해야 pnpm exec 가 찾는다.
      - run: pnpm install --frozen-lockfile
      # 로컬에서 돌리는 것과 같은 타깃이다 (Makefile). uv sync 는 uv run 이 알아서 한다.
      - run: make contracts-check

  # 화면 문구가 `docs/문구.md` 를 벗어났는지 (`주차계획/W6.md` 13번).
  #
  # **나흘에 넷이고 둘이 운영까지 갔다** — 하나는 **대표 승인된 프라이버시 고지**, 하나는
  # **일주일째** 화면에 떠 있었다. **넷 다 사람이 우연히 찾았다.**
  #
  # **잡이 가볍다** — 의존성이 없고(노드 표준 라이브러리만) 파일 열한 개를 읽는다.
  # 그래서 `web` 잡 안에 넣지 않고 갈라 둔다: **`api/app/errors.py` 와 `docs/문구.md` 가
  # 바뀔 때도 돌아야 하는데**, `web` 잡의 경로 필터는 `web/**` 다.
  copy:
    needs: changes
    if: needs.changes.outputs.copy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc }
      # 로컬에서 돌리는 것과 **같은 타깃**이다 (Makefile).
      - run: make check-copy

  # 브랜치 보호에서 필수로 걸 유일한 체크.
  # api·web 은 변경 경로에 따라 skip 되므로 직접 필수로 걸면 안 된다 —
  # docs 만 바꾼 PR이 보고되지 않은 체크를 기다리며 영구히 막힐 수 있다.
  #
  # **느린 잡(`api-slow`)도 물린다.** 밖에 두면 **그 잡만 빨간 채로 몇 주가 갈 수 있다** —
  # 여기가 유일한 집계 지점이고, 이 저장소가 반복해서 밟은 것이 「검사가 있다」와
  # 「검사가 돌았다」의 차이였다. skip 은 failure·cancelled 가 아니라 그대로 통과하므로
  # **경로 필터로 건너뛴 커밋은 여전히 초록**이다.
  # **⏳ 그래서 결제가 풀린 첫 실행에 이것이 빨개질 수 있다. 그것이 의도다** —
  # 안 보이는 것보다 빨간 것이 낫다.
  all-green:
    needs: [changes, api, api-slow, web, web-slow, contracts, copy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 잡 결과 집계
        run: |
          # **`needs.api-slow` 로 쓰면 안 된다** — 식 안에서 `-` 는 뺄셈이라
          # `needs.api` 에서 `slow` 를 빼려 들고 값이 조용히 빈다. 대괄호로 집는다.
          echo "changes=${{ needs.changes.result }}  api=${{ needs.api.result }}  api-slow=${{ needs['api-slow'].result }}  web=${{ needs.web.result }}  web-slow=${{ needs['web-slow'].result }}  contracts=${{ needs.contracts.result }}  copy=${{ needs.copy.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "::error::실패한 잡이 있습니다"; exit 1
          fi
          if [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::취소된 잡이 있습니다"; exit 1
          fi
          echo "통과"
